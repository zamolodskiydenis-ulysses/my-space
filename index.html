        .phoenix-home {

}

        .phoenix-title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: clamp(22px, 3vw, 42px);
    letter-spacing: 0.42em;
    font-weight: 600;
    color: rgba(241, 228, 213, 0.88);
    text-shadow: 0 0 30px rgba(190, 82, 24, 0.28);
}

        .phoenix-wheel {
    width: min(88vw, 900px);
    height: min(88vw, 900px);
    max-height: 86vh;
    max-width: 86vh;
    position: relative;
    border-radius: 50%;
    transform: rotate(22.5deg);
    background:
        conic-gradient(
            from -22.5deg,
            rgba(150, 62, 20, 0.20) 0deg 45deg,
            rgba(255,255,255,0.045) 45deg 46deg,
            rgba(255,255,255,0.012) 46deg 90deg,
            rgba(255,255,255,0.045) 90deg 91deg,
            rgba(255,255,255,0.012) 91deg 135deg,
            rgba(255,255,255,0.045) 135deg 136deg,
            rgba(255,255,255,0.012) 136deg 180deg,
            rgba(255,255,255,0.045) 180deg 181deg,
            rgba(255,255,255,0.012) 181deg 225deg,
            rgba(255,255,255,0.045) 225deg 226deg,
            rgba(255,255,255,0.012) 226deg 270deg,
            rgba(255,255,255,0.045) 270deg 271deg,
            rgba(255,255,255,0.012) 271deg 315deg,
            rgba(255,255,255,0.045) 315deg 316deg,
            rgba(255,255,255,0.012) 316deg 360deg
        );
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 0 70px rgba(137, 55, 17, 0.16),
        inset 0 0 100px rgba(0,0,0,0.78);
}

        .phoenix-wheel::before {
    content: '';
    position: absolute;
    inset: 6%;
    border: 1px solid rgba(255,255,255,0.075);
    border-radius: 50%;
    box-shadow: inset 0 0 45px rgba(0,0,0,0.7);
}

.phoenix-wheel::after {
    content: '';
    position: absolute;
    inset: 15%;
    border: 1px solid rgba(177, 76, 26, 0.16);
    border-radius: 50%;
}

        .phoenix-sector {
    position: absolute;
    width: 50%;
    height: 50%;
    top: 0;
    left: 50%;
    transform-origin: 0 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 9%;
    color: rgba(255,255,255,0.08);
    transition:
        background .3s ease,
        color .3s ease,
        box-shadow .3s ease;
}

.phoenix-sector::after {
    content: '';
    position: absolute;
    inset: 0;
    border-right: 1px solid rgba(255,255,255,0.055);
    transform: skewY(-45deg);
    transform-origin: 100% 0;
}

        .phoenix-sector span,
.phoenix-sector strong {
    transform: rotate(-22.5deg);
}

.phoenix-sector span {
    font-size: clamp(22px, 3.5vw, 42px);
    filter: drop-shadow(0 0 18px rgba(190, 72, 18, 0.42));
}

.phoenix-sector strong {
    position: absolute;
    top: 31%;
    font-size: clamp(11px, 1.35vw, 18px);
    letter-spacing: 0.22em;
    font-weight: 500;
}

        .sector-1 { transform: rotate(0deg) skewY(-45deg); }
        .sector-2 { transform: rotate(45deg) skewY(-45deg); }
        .sector-3 { transform: rotate(90deg) skewY(-45deg); }
        .sector-4 { transform: rotate(135deg) skewY(-45deg); }
        .sector-5 { transform: rotate(180deg) skewY(-45deg); }
        .sector-6 { transform: rotate(225deg) skewY(-45deg); }
        .sector-7 { transform: rotate(270deg) skewY(-45deg); }
        .sector-8 { transform: rotate(315deg) skewY(-45deg); }

        .sector-1 {
    cursor: pointer;
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(173, 67, 20, 0.34),
            rgba(82, 30, 12, 0.08) 50%,
            transparent 72%
        );
    color: #ead4c3;
    box-shadow:
        inset 0 0 65px rgba(155, 58, 17, 0.14);
}

        .sector-1:hover {
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(210, 86, 25, 0.48),
            rgba(100, 35, 12, 0.12) 50%,
            transparent 74%
        );
    color: #fff3e8;
    box-shadow:
        inset 0 0 75px rgba(190, 68, 18, 0.20),
        0 0 35px rgba(170, 62, 18, 0.08);
}

        .phoenix-center {
    position: absolute;
    width: 30%;
    height: 30%;
    left: 35%;
    top: 35%;
    border-radius: 50%;
    transform: rotate(-22.5deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

}

        .phoenix-flame {

}

.phoenix-center-text {

<div id="authPanel" style="
    max-width: 420px;

">
    <h2 style="margin-top: 0;">Вход в Phoenix</h2>

    <form id="loginForm">
        <input

            type="email"
            placeholder="Email"
            required
            style="

                padding: 12px;
                margin-bottom: 12px;
                background: #111;
                color: #eee;
                border: 1px solid #444;
                border-radius: 8px;
            "

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            required
            style="
                width: 100%;

                background: #111;
                color: #eee;
                border: 1px solid #444;
                border-radius: 8px;
            "

        <button
            type="submit"
            style="
                width: 100%;
                padding: 12px;
                border: 0;
                border-radius: 8px;
                cursor: pointer;
            "
        >
            Войти
        </button>
    </form>

    <p id="authMessage" style="color: #999;"></p>
</div>

<script>
    const authPanel = document.getElementById('authPanel');
    const loginForm = document.getElementById('loginForm');
    const authMessage = document.getElementById('authMessage');

    function showApp() {
        authPanel.style.display = 'none';

        const container = document.querySelector('.container');

        if (container) {
            container.style.display = 'block';
        }
    }

    function showLogin() {
        authPanel.style.display = 'block';

        const container = document.querySelector('.container');

        if (container) {
            container.style.display = 'none';
        }
    }

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        authMessage.textContent = 'Выполняется вход...';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            authMessage.textContent = 'Ошибка входа: ' + error.message;
            return;
        }

        showApp();
    });

    async function checkSession() {
        const { data } = await supabaseClient.auth.getSession();

        if (data.session) {
            showApp();
        } else {
            showLogin();
        }
    }

    checkSession();
</script>

<script>
    function getPeriodLabel(period) {
        const labels = {
            year: 'Год',
            month: 'Месяц',
            week: 'Неделя',
            day: 'День'
        };

        return labels[period] || period || 'Не указан';
    }

    function getStatusLabel(status) {
        const labels = {
            active: 'Активна',
            completed: 'Завершена',
            paused: 'На паузе'
        };

        return labels[status] || status || 'Не указан';
    }

    function getPriorityLabel(priority) {
        const labels = {
            4: 'Обязательно',
            3: 'Важно',
            2: 'Желательно',
            1: 'Если есть время'
        };

        return labels[priority] || 'Не указан';
    }

    async function loadGoals() {
        const goalsList = document.getElementById('goalsList');

        const { data, error } = await supabaseClient
            .from('goals')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            goalsList.textContent = 'Ошибка загрузки целей: ' + error.message;
            return;
        }

        if (!data || data.length === 0) {
            goalsList.textContent = 'Пока целей нет.';
            return;
        }

        goalsList.innerHTML = data.map(goal => `
            <div style="
                padding: 16px 0;
                border-bottom: 1px solid #292929;
            ">
                <strong>${goal.title || 'Без названия'}</strong>

                ${goal.description
                    ? `<div style="color:#aaa; margin-top:6px;">
                        ${goal.description}
                    </div>`
                    : ''
                }

                <div style="color:#999; margin-top:8px;">
                    Период: ${getPeriodLabel(goal.period)}
                </div>

                <div style="color:#999;">
                    Статус: ${getStatusLabel(goal.status)}
                </div>

                <div style="color:#999;">
                    Приоритет: ${getPriorityLabel(goal.priority)}
                </div>

                ${goal.start_date
                    ? `<div style="color:#999;">
                        Начало: ${goal.start_date}
                    </div>`
                    : ''
                }

                ${goal.due_date
                    ? `<div style="color:#999;">
                        Дедлайн: ${goal.due_date}
                    </div>`
                    : ''
                }
            </div>
        `).join('');
    }


    document.getElementById('goalForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const title = document.getElementById('goalTitle').value.trim();
        const description = document.getElementById('goalDescription').value.trim();
        const period = document.getElementById('goalPeriod').value;
        const status = document.getElementById('goalStatus').value;
        const priority = document.getElementById('goalPriority').value;
        const startDate = document.getElementById('goalStartDate').value;
        const dueDate = document.getElementById('goalDueDate').value;

        if (!title || !period || !status || !priority) {
            return;
        }

        const priorityNumber =

                    background: #333;

                    border: 0;

                    cursor: pointer;
                "
            >
                ☑ Выполнить
            </button>

    document.getElementById('taskForm').addEventListener('submit', async (event) => {

        const title =
            document.getElementById('taskTitle').value.trim();

        const description =
            document.getElementById('taskDescription').value.trim();

        const status =
            document.getElementById('taskStatus').value;

        const priority =
            document.getElementById('taskPriority').value;

        const dueDate =
            document.getElementById('taskDueDate').value;

        const selectedGoalIds = Array.from(
            document.querySelectorAll('.task-goal-checkbox:checked')
        ).map(checkbox => Number(checkbox.value));


        if (!title || !status || !priority) {
            return;
        }


        const priorityNumber =
            priority === 'mandatory' ? 4 :
            priority === 'important' ? 3 :
            priority === 'desirable' ? 2 :
            1;


        const { data: task, error: taskError } =
            await supabaseClient
                .from('tasks')
                .insert({
                    title: title,
                    description: description || null,
                    status: status,
                    priority: priorityNumber,
                    due_date: dueDate || null
                })
                .select()
                .single();


        if (taskError) {
            alert('Ошибка создания задачи: ' + taskError.message);
            return;
        }


        if (selectedGoalIds.length > 0) {

            const links = selectedGoalIds.map(goalId => ({
                task_id: task.id,
                goal_id: goalId
            }));

            const { error: linkError } =
                await supabaseClient
                    .from('task_goal_links')
                    .insert(links);

            if (linkError) {
                alert(
                    'Задача создана, но не удалось сохранить связи с целями: ' +
                    linkError.message
                );
            }
        }


        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDescription').value = '';
        document.getElementById('taskStatus').value = '';
        document.getElementById('taskPriority').value = '';
        document.getElementById('taskDueDate').value = '';

        document
            .querySelectorAll('.task-goal-checkbox')
            .forEach(checkbox => {
                checkbox.checked = false;
            });


        await loadTasks();
    });


    supabaseClient.auth.getSession().then(({ data }) => {

        if (data.session) {
            loadTaskGoals();
            loadTasks();
        }

    });

</script>

    async function loadRoutines() {
    const routinesList = document.getElementById('routinesList');

    const { data: routines, error } = await supabaseClient
        .from('routines')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) {
        routinesList.textContent =
            'Ошибка загрузки рутин: ' + error.message;
        return;
    }

    if (!routines || routines.length === 0) {
        routinesList.textContent = 'Пока рутин нет.';
        return;
    }


    // Получаем сегодняшнюю дату в локальном времени браузера
    const now = new Date();

    const formatDate = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');

        return `${year}-${month}-${day}`;
    };

    const today = formatDate(now);


    // Определяем текущий период для каждой рутины
    function getPeriodRange(frequency) {

        const start = new Date(now);
        const end = new Date(now);

        if (frequency === 'daily') {

            return {
                start: today,
                end: today
            };
        }


        if (frequency === 'weekly') {

            const dayOfWeek = now.getDay();

            // Понедельник = 1, воскресенье = 0
            const daysFromMonday =
                dayOfWeek === 0
                    ? 6
                    : dayOfWeek - 1;

            start.setDate(
                now.getDate() - daysFromMonday
            );

            end.setDate(
                start.getDate() + 6
            );

            return {
                start: formatDate(start),
                end: formatDate(end)
            };
        }


        if (frequency === 'monthly') {

            start.setDate(1);

            end.setMonth(
                now.getMonth() + 1,
                0
            );

            return {
                start: formatDate(start),
                end: formatDate(end)
            };
        }


        return {
            start: today,

        };

                        </div>

                        ${routineGoals.map(goal => `
                            <div style="
                                color: #ddd;
                                margin-top: 4px;
                            ">
                                → ${goal.title || 'Без названия'}
                                <span style="color:#777;">
                                    (${getGoalPeriodLabel(goal.period)})
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `
                : '';


        let progressHtml;


        if (routine.frequency === 'daily') {

            progressHtml = completedToday
                ? `
                    <div style="
                        color: #aaa;
                        margin-top: 10px;
                    ">
                        Сегодня: ☑ Выполнено
                    </div>
                `
                : `
                    <div style="
                        color: #aaa;
                        margin-top: 10px;
                    ">
                        Сегодня: ☐ Не выполнено
                    </div>
                `;

        } else {

            progressHtml = `
                <div style="
                    color: #aaa;
                    margin-top: 10px;
                ">
                    Выполнено:
                    ${completedCount} / ${target}
                </div>

                <div style="
                    color: #aaa;
                ">
                    Осталось:
                    ${remaining}
                </div>
            `;
        }


        const completionButton =
    routine.frequency !== 'daily' &&
    completedCount >= target
        ? `
            <div style="
                margin-top: 12px;
                color: #aaa;
            ">
                🎯 План выполнен
            </div>
        `
        : completedToday
            ? `
                <div style="
                    margin-top: 12px;
                    color: #aaa;
                ">
                    ☑ Выполнено сегодня
                </div>
            `
            : `
                <div style="margin-top: 12px;">
                    <button
                        type="button"
                        onclick="completeRoutineToday(${routine.id})"
                        style="
                            padding: 7px 12px;
                            background: #333;
                            color: white;
                            border: 0;
                            border-radius: 7px;
                            cursor: pointer;
                        "
                    >
                        ☑ Выполнить сегодня
                    </button>
                </div>
            `;


        return `
            <div style="
                padding: 16px 0;
                border-bottom: 1px solid #292929;
            ">

                <strong>
                    ${routine.title || 'Без названия'}
                </strong>


                ${routine.description
                    ? `<div style="
                        color:#aaa;
                        margin-top:6px;
                    ">
                        ${routine.description}
                    </div>`
                    : ''
                }


                <div style="
                    color:#999;
                    margin-top:8px;
                ">
                    Частота:
                    ${getRoutineFrequencyLabel(
                        routine.frequency
                    )}
                </div>


                ${routine.times_per_period
                    ? `<div style="color:#999;">
                        Раз за период:
                        ${routine.times_per_period}
                    </div>`
                    : ''
                }


                ${routine.time_of_day
                    ? `<div style="color:#999;">
                        Время:
                        ${routine.time_of_day}
                    </div>`
                    : ''
                }


                ${routine.duration_minutes
                    ? `<div style="color:#999;">
                        Длительность:
                        ${routine.duration_minutes} мин.
                    </div>`
                    : ''
                }


                <div style="color:#999;">
                    Статус:
                    ${routine.is_active
                        ? 'Активна'
                        : 'Неактивна'}
                </div>


                ${progressHtml}


                ${goalsHtml}


                ${routine.is_active
                    ? completionButton
                    : ''
                }

            </div>
        `;
    }).join('');
}

    document.getElementById('routineForm')
    .addEventListener('submit', async (event) => {

        event.preventDefault();

        const title =
            document.getElementById('routineTitle').value.trim();

        const description =
            document.getElementById('routineDescription').value.trim();

        const frequency =
            document.getElementById('routineFrequency').value;

        const timesPerPeriod =
            document.getElementById('routineTimesPerPeriod').value;

        const timeOfDay =
            document.getElementById('routineTimeOfDay').value.trim();

        const duration =
            document.getElementById('routineDuration').value;

        const isActive =
            document.getElementById('routineActive').checked;

        const selectedGoalIds = Array.from(
            document.querySelectorAll(
                '.routine-goal-checkbox:checked'
            )
        ).map(checkbox => Number(checkbox.value));


        if (!title || !frequency) {
            return;
        }


        const { data: routine, error: routineError } =
            await supabaseClient
                .from('routines')
                .insert({
                    title: title,
                    description: description || null,
                    frequency: frequency,
                    times_per_period:
                        timesPerPeriod
                            ? Number(timesPerPeriod)
                            : null,
                    time_of_day: timeOfDay || null,
                    duration_minutes:
                        duration
                            ? Number(duration)
                            : null,
                    is_active: isActive
                })
                .select()
                .single();


        if (routineError) {
            alert(
                'Ошибка создания рутины: ' +
                routineError.message
            );
            return;
        }


        /*
         * Сохраняем связи с выбранными целями
         */
        if (selectedGoalIds.length > 0) {

            const links = selectedGoalIds.map(goalId => ({
                routine_id: routine.id,
                goal_id: goalId
            }));

            const {
                data: savedLinks,
                error: linkError
            } = await supabaseClient
                .from('routine_goal_links')
                .insert(links)
                .select();


            if (linkError) {
                alert(
                    'Рутина создана, но связь с целью НЕ сохранена.\n\n' +
                    'Ошибка: ' + linkError.message
                );
                return;
            }

            if (!savedLinks || savedLinks.length !== links.length) {
                alert(
                    'Рутина создана, но не все связи с целями сохранились.'
                );
                return;
            }
        }


        /*
         * Очищаем форму
         */
        document.getElementById('routineTitle').value = '';
        document.getElementById('routineDescription').value = '';
        document.getElementById('routineFrequency').value = '';
        document.getElementById('routineTimesPerPeriod').value = '';
        document.getElementById('routineTimeOfDay').value = '';
        document.getElementById('routineDuration').value = '';
        document.getElementById('routineActive').checked = true;

        document
            .querySelectorAll('.routine-goal-checkbox')
            .forEach(checkbox => {
                checkbox.checked = false;
            });


        await loadRoutines();
    });


    supabaseClient.auth.getSession().then(({ data }) => {
        if (data.session) {
            loadRoutineGoals();
    loadRoutines();
        }
    });

</script>

<script>
async function showWhy(type, itemId, button) {

    const table =
        type === 'task'
            ? 'task_goal_links'
            : 'routine_goal_links';

    const itemField =
        type === 'task'
            ? 'task_id'
            : 'routine_id';


    const { data: directLinks, error: directError } =
        await supabaseClient
            .from(table)
            .select('goal_id')
            .eq(itemField, itemId);


    if (directError) {
        alert(
            'Ошибка загрузки связи с целью: ' +
            directError.message
        );
        return;
    }


    if (!directLinks || directLinks.length === 0) {
        button.parentElement.insertAdjacentHTML(
            'afterend',
            `
                <div style="
                    margin-top: 8px;
                    color: #777;
                    font-size: 14px;
                ">
                    У этого действия пока нет связанной цели.
                </div>
            `
        );

        button.style.display = 'none';
        return;
    }


    const { data: allGoals, error: goalsError } =
        await supabaseClient
            .from('goals')
            .select('id, title, period');


    if (goalsError) {
        alert(
            'Ошибка загрузки целей: ' +
            goalsError.message
        );
        return;
    }


    const { data: goalLinks, error: linksError } =
        await supabaseClient
            .from('goal_links')
            .select('parent_goal_id, child_goal_id');


    if (linksError) {
        alert(
            'Ошибка загрузки связей целей: ' +
            linksError.message
        );
        return;
    }


    const goalsMap = new Map(
        (allGoals || []).map(goal => [
            goal.id,
            goal
        ])
    );


    const parentsMap = new Map();


    (goalLinks || []).forEach(link => {

        if (!parentsMap.has(link.child_goal_id)) {
            parentsMap.set(
                link.child_goal_id,
                []
            );
        }

        parentsMap.get(
            link.child_goal_id
        ).push(link.parent_goal_id);
    });


    const chain = [];
    const visited = new Set();


    function addGoalChain(goalId) {

        if (visited.has(goalId)) {
            return;
        }

        visited.add(goalId);


        const goal = goalsMap.get(goalId);

        if (!goal) {
            return;
        }


        chain.push(goal);


        const parents =
            parentsMap.get(goalId) || [];


        parents.forEach(parentId => {
            addGoalChain(parentId);
        });
    }


    directLinks.forEach(link => {
        addGoalChain(link.goal_id);
    });


    const chainHtml = chain.length > 0
        ? `
            <div style="
                margin-top: 8px;
                padding: 10px;
                background: #151515;
                border-radius: 8px;
                color: #aaa;
                font-size: 14px;
            ">

                <div style="
                    color: #ddd;
                    margin-bottom: 6px;
                ">
                    🎯 Связь с целями
                </div>

                ${chain.map((goal, index) => `
                    <div style="
                        margin-top: 4px;
                    ">
                        ${index > 0 ? '↑ ' : '→ '}
                        ${goal.title || 'Без названия'}
                        <span style="color:#777;">
                            (${getGoalPeriodLabel(goal.period)})
                        </span>
                    </div>
                `).join('')}

            </div>
        `
        : `
            <div style="
                margin-top: 8px;
                color: #777;
                font-size: 14px;
            ">
                Связанные цели не найдены.
            </div>
        `;


    button.parentElement.insertAdjacentHTML(
        'afterend',
        chainHtml
    );

    button.style.display = 'none';
}
async function loadToday() {

    const todayContent =
        document.getElementById('todayContent');

    const now = new Date();

    const today =
        `${now.getFullYear()}-` +
        `${String(now.getMonth() + 1).padStart(2, '0')}-` +
        `${String(now.getDate()).padStart(2, '0')}`;


    /*
     * =========================
     * ЗАДАЧИ НА СЕГОДНЯ
     * =========================
     */

    const { data: tasks, error: tasksError } =
        await supabaseClient
            .from('tasks')
            .select('*')
            .eq('status', 'open')
            .eq('due_date', today)
            .order('priority', { ascending: false });


    if (tasksError) {
        todayContent.textContent =
            'Ошибка загрузки задач: ' +
            tasksError.message;
        return;
    }


    /*
     * =========================
     * РУТИНЫ
     * =========================
     */

    const { data: routines, error: routinesError } =
        await supabaseClient
            .from('routines')
            .select('*')
            .eq('is_active', true)
            .order('created_at', { ascending: false });


    if (routinesError) {
        todayContent.textContent =
            'Ошибка загрузки рутин: ' +
            routinesError.message;
        return;
    }


    const routineIds =
        (routines || []).map(routine => routine.id);


    let completions = [];


    if (routineIds.length > 0) {

        const { data, error } =
            await supabaseClient
                .from('routine_completions')
                .select(
                    'routine_id, completion_date, status'
                )
                .in('routine_id', routineIds);


        if (error) {
            todayContent.textContent =
                'Ошибка загрузки выполнений рутин: ' +
                error.message;
            return;
        }

        completions = data || [];
    }


    /*
     * =========================
     * СВЯЗИ РУТИН С ЦЕЛЯМИ
     * =========================
     */

    let routineLinks = [];


    if (routineIds.length > 0) {

        const { data, error } =
            await supabaseClient
                .from('routine_goal_links')
                .select('routine_id, goal_id')
                .in('routine_id', routineIds);


        if (error) {
            todayContent.textContent =
                'Ошибка загрузки связей рутин: ' +
                error.message;
            return;
        }

        routineLinks = data || [];
    }


    /*
     * =========================
     * СВЯЗИ ЗАДАЧ С ЦЕЛЯМИ
     * =========================
     */

    let taskLinks = [];

    const taskIds =
        (tasks || []).map(task => task.id);


    if (taskIds.length > 0) {

        const { data, error } =
            await supabaseClient
                .from('task_goal_links')
                .select('task_id, goal_id')
                .in('task_id', taskIds);


        if (error) {
            todayContent.textContent =
                'Ошибка загрузки связей задач: ' +
                error.message;
            return;
        }

        taskLinks = data || [];
    }


    /*
     * =========================
     * ВСЕ НУЖНЫЕ ЦЕЛИ
     * =========================
     */

    const goalIds = [
        ...new Set([
            ...routineLinks.map(link => link.goal_id),
            ...taskLinks.map(link => link.goal_id)
        ])
    ];


    let goals = [];


    if (goalIds.length > 0) {

        const { data, error } =
            await supabaseClient
                .from('goals')
                .select('id, title, period')
                .in('id', goalIds);


        if (error) {
            todayContent.textContent =
                'Ошибка загрузки целей: ' +
                error.message;
            return;
        }

        goals = data || [];
    }


    /*
     * =========================
     * ЗАДАЧИ
     * =========================
     */

    let tasksHtml = '';


    if (!tasks || tasks.length === 0) {

        tasksHtml = `
            <div style="color:#777;">
                На сегодня задач с дедлайном нет.
            </div>
        `;

    } else {

        tasksHtml = tasks.map(task => {

            const linkedGoalIds =
                taskLinks
                    .filter(link =>
                        link.task_id === task.id
                    )
                    .map(link => link.goal_id);


            const linkedGoals =
                goals.filter(goal =>
                    linkedGoalIds.includes(goal.id)
                );


            const goalHtml =
                linkedGoals.length > 0
                    ? `
                        <div style="
                            margin-top: 6px;
                            color: #888;
                            font-size: 14px;
                        ">
                            🎯
                            ${linkedGoals.map(goal =>
                                `→ ${goal.title}`
                            ).join(', ')}
                        </div>
                    `
                    : '';
const whyButton = `
    <div style="margin-top: 8px;">
        <button
            type="button"
            onclick="showWhy('task', ${task.id}, this)"
            style="
                padding: 6px 10px;
                background: #333;
                color: white;
                border: 0;
                border-radius: 7px;
                cursor: pointer;
            "
        >
            🎯 Почему?
        </button>
    </div>
`;

            return `
                <div style="
                    padding: 12px 0;
                    border-bottom: 1px solid #292929;
                ">

                    <div>
                        ☐
                        <strong>
                            ${task.title || 'Без названия'}
                        </strong>
                    </div>

                    ${task.description
                        ? `
                            <div style="
                                color:#888;
                                margin-top:5px;
                            ">
                                ${task.description}
                            </div>
                        `
                        : ''
                    }

                    ${goalHtml}
${whyButton}
                    <div style="
                        margin-top: 8px;
                    ">
                        <button
                            type="button"
                            onclick="completeTask(${task.id}); loadToday();"
                            style="
                                padding: 6px 10px;
                                background: #333;
                                color: white;
                                border: 0;
                                border-radius: 7px;
                                cursor: pointer;
                            "
                        >
                            ☑ Выполнить
                        </button>
                    </div>

                </div>
            `;

        }).join('');
    }


    /*
     * =========================
     * РУТИНЫ НА СЕГОДНЯ
     * =========================
     */

    const todayRoutines =
        (routines || []).filter(routine => {

            const routineCompletions =
                completions.filter(completion =>
                    completion.routine_id === routine.id &&
                    completion.status === 'completed'
                );


            const completedToday =
                routineCompletions.some(completion =>
                    completion.completion_date === today
                );


            /*
             * Если сегодня уже выполнена —
             * в «Сегодня» её больше не показываем.
             */

            if (completedToday) {
                return false;
            }


            /*
             * Для ежедневной рутины
             * достаточно того, что сегодня она не выполнена.
             */

            if (routine.frequency === 'daily') {
                return true;
            }


            /*
             * Определяем начало текущего периода.
             */

            let periodStart;


            if (routine.frequency === 'weekly') {

                const dayOfWeek = now.getDay();

                const daysFromMonday =
                    dayOfWeek === 0
                        ? 6
                        : dayOfWeek - 1;

                periodStart = new Date(now);

                periodStart.setDate(
                    now.getDate() - daysFromMonday
                );

            } else if (
                routine.frequency === 'monthly'
            ) {

                periodStart = new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    1
                );

            } else {

                return false;
            }


            const periodStartString =
                `${periodStart.getFullYear()}-` +
                `${String(
                    periodStart.getMonth() + 1
                ).padStart(2, '0')}-` +
                `${String(
                    periodStart.getDate()
                ).padStart(2, '0')}`;


            const completedThisPeriod =
                routineCompletions.filter(completion =>
                    completion.completion_date >=
                    periodStartString &&
                    completion.completion_date <=
                    today
                ).length;


            const target =
                routine.times_per_period
                    ? Number(
                        routine.times_per_period
                    )
                    : 1;


            return completedThisPeriod < target;
        });


    let routinesHtml = '';


    if (todayRoutines.length === 0) {

        routinesHtml = `
            <div style="color:#777;">
                Все необходимые рутины на сегодня выполнены.
            </div>
        `;

    } else {

        routinesHtml =
            todayRoutines.map(routine => {

                const linkedGoalIds =
                    routineLinks
                        .filter(link =>
                            link.routine_id === routine.id
                        )
                        .map(link => link.goal_id);


                const linkedGoals =
                    goals.filter(goal =>
                        linkedGoalIds.includes(goal.id)
                    );


                const goalHtml =
                    linkedGoals.length > 0
                        ? `
                            <div style="
                                margin-top: 6px;
                                color: #888;
                                font-size: 14px;
                            ">
                                🎯
                                ${linkedGoals.map(goal =>
                                    `→ ${goal.title}`
                                ).join(', ')}
                            </div>
                        `
                        : '';

const whyButton = `
    <div style="margin-top: 8px;">
        <button
            type="button"
            onclick="showWhy('routine', ${routine.id}, this)"
            style="
                padding: 6px 10px;
                background: #333;
                color: white;
                border: 0;
                border-radius: 7px;
                cursor: pointer;
            "
        >
            🎯 Почему?
        </button>
    </div>
`;
                return `
                    <div style="
                        padding: 12px 0;
                        border-bottom: 1px solid #292929;
                    ">

                        <div>
                            ☐
                            <strong>
                                ${routine.title}
                            </strong>
                        </div>

                        <div style="
                            color:#888;
                            margin-top:5px;
                        ">
                            ${getRoutineFrequencyLabel(
                                routine.frequency
                            )}
                            ·
                            ${routine.times_per_period || 1}
                            раз за период
                        </div>

                        ${routine.time_of_day
                            ? `
                                <div style="
                                    color:#888;
                                ">
                                    ${routine.time_of_day}
                                </div>
                            `
                            : ''
                        }

                        ${routine.duration_minutes
                            ? `
                                <div style="
                                    color:#888;
                                ">
                                    ${routine.duration_minutes}
                                    мин.
                                </div>
                            `
                            : ''
                        }

                        ${goalHtml}
${whyButton}
                        <div style="
                            margin-top: 8px;
                        ">
                            <button
                                type="button"
                                onclick="completeRoutineToday(${routine.id}); loadToday();"
                                style="
                                    padding: 6px 10px;
                                    background: #333;
                                    color: white;
                                    border: 0;
                                    border-radius: 7px;
                                    cursor: pointer;
                                "
                            >
                                ☑ Выполнить сегодня
                            </button>
                        </div>

                    </div>
                `;

            }).join('');
    }


    /*
     * =========================
     * ИТОГОВЫЙ ЭКРАН
     * =========================
     */

    todayContent.innerHTML = `

        <div style="
            margin-bottom: 28px;
        ">

            <h3 style="
                margin-bottom: 8px;
            ">
                📋 Задачи
            </h3>

            ${tasksHtml}

        </div>


        <div>

            <h3 style="
                margin-bottom: 8px;
            ">
                🔁 Рутины
            </h3>

            ${routinesHtml}

        </div>

    `;
}
supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) {
        loadToday();
    }
});
</script>
